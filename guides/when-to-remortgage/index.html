document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

https://credocapital.ae/guides/when-to-remortgage\"}\n  <\u002Fscript>\n  <style>\n    html { scroll-behavior: smooth; }\n    body { margin: 0; background: #ffffff; font-family: \"Geist\", sans-serif; -webkit-font-smoothing: antialiased; }\n    * { box-sizing: border-box; }\n    a { color: #111111; text-decoration: underline; text-decoration-color: transparent; transition: text-decoration-color .15s; }\n    a:hover { text-decoration-color: #b8912f; color: #b8912f; }\n  <\u002Fstyle>\n  <script type=\"application/ld+json\">\n  {\"@context\":\"https://schema.org\",\"@type\":\"FinancialService\",\"name\":\"Credo Capital\",\"url\":\"https://credocapital.ae\",\"logo\":\"https://credocapital.ae/assets/logo-dark.png\",\"image\":\"https://credocapital.ae/assets/logo-dark.png\",\"description\":\"Independent mortgage and home finance advisory in the UAE, comparing every major bank across conventional and Islamic finance.\",\"areaServed\":\"AE\",\"address\":{\"@type\":\"PostalAddress\",\"addressCountry\":\"AE\"},\"telephone\":\"+971589045696\",\"priceRange\":\"Free to buyers\",\"sameAs\":[\"https://instagram.com\",\"https://facebook.com\",\"https://x.com\",\"https://linkedin.com\"]}\n  <\u002Fscript>\n  <script type=\"application/ld+json\">\n  {\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"Is there a minimum period before I can remortgage?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Most banks allow refinancing after an initial lock-in period, commonly 6-12 months, though this varies by lender and product.\"}},{\"@type\":\"Question\",\"name\":\"Do early settlement fees apply to Islamic finance too?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, Islamic finance structures carry an equivalent early settlement charge, generally in line with the same UAE Central Bank guidance.\"}},{\"@type\":\"Question\",\"name\":\"Can I remortgage with a different bank than my current one?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, switching to a new lender is one of the most common reasons to remortgage, alongside simply renegotiating with your existing bank.\"}}]}\n  <\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"position:relative;background:#ffffff;color:#111111;overflow-x:clip;\">\n\n  <header style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;row-gap:10px;padding:14px clamp(16px,4vw,64px);background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #e3e3e3;flex-wrap:wrap;\">\n    <a href=\"index.dc.html\" style=\"display:flex;align-items:center;gap:10px;text-decoration:none;\">\n      <img src=\"410dea27-6003-4413-b90e-56f5916ef6a5\" alt=\"Credo Capital, Every Step to Ownership\" style=\"height:26px;width:auto;display:block;\">\n    <\u002Fa>\n    <div style=\"{{ navGroupStyle }}\">\n    <nav style=\"{{ navInnerStyle }}\">\n      <div style=\"position:relative;\" sc-camel-on-mouse-enter=\"{{ openMortgagesNav }}\" sc-camel-on-mouse-leave=\"{{ closeNav }}\">\n        <span style=\"font-size:14px;font-weight:500;color:#28303b;cursor:pointer;display:inline-flex;align-items:center;gap:4px;\">Mortgages\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#28303b\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <sc-if value=\"{{ mortgagesNavOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:100%;left:0;padding-top:12px;z-index:60;\">\n            <div style=\"background:#ffffff;border:1px solid #e3e3e3;border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,0.14);min-width:220px;padding:8px;\">\n              <a href=\"Primary Residence.dc.html\" style=\"display:block;padding:10px 14px;border-radius:6px;font-size:13.5px;color:#111111;text-decoration:none;\">Primary / Handover<\u002Fa>\n              <a href=\"Secondary Resale.dc.html\" style=\ f;border-radius:10px;padding:28px;border:1px solid #e3e3e3;box-shadow:0 20px 50px -20px rgba(0,0,0,0.15);position:sticky;top:100px;\">\n        <div style=\"margin-bottom:20px;\">\n          <div style=\"font-size:17px;font-weight:600;color:#111111;\">Talk to a mortgage advisor.<\u002Fdiv>\n          <div style=\"font-size:13px;color:#5f6368;margin-top:4px;\">Two-minute form, no obligation.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ leadSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:36px 4px;text-align:center;\">\n            <div style=\"font-size:30px;margin-bottom:14px;color:#111111;\">✓<\u002Fdiv>\n            <h3 style=\"font-size:17px;font-weight:600;margin:0 0 8px;color:#111111;\">Request received<\u002Fh3>\n            <p style=\"font-size:13.5px;color:#5f6368;line-height:1.6;margin:0;\">A mortgage advisor will contact you within one business day.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ leadNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;\">\n            <div>\n              <input type=\"text\" placeholder=\"Full name\" value=\"{{ lead.name }}\" sc-camel-on-change=\"{{ setName }}\" style=\"width:100%;padding:12px 14px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:14px;font-family:'Geist',sans-serif;\">\n              <sc-if value=\"{{ errors.name }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#b3261e;margin-top:6px;\">{{ errors.name }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;\">\n              <div>\n                <input type=\"text\" placeholder=\"Mobile number\" value=\"{{ lead.mobile }}\" sc-camel-on-change=\"{{ setMobile }}\" style=\"width:100%;padding:12px 14px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:14px;font-family:'Geist',sans-serif;\">\n                <sc-if value=\"{{ errors.mobile }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#b3261e;margin-top:6px;\">{{ errors.mobile }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <div>\n                <input type=\"email\" placeholder=\"Email\" value=\"{{ lead.email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"width:100%;padding:12px 14px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:14px;font-family:'Geist',sans-serif;\">\n                <sc-if value=\"{{ errors.email }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#b3261e;margin-top:6px;\">{{ errors.email }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;\">\n              <sc-raw-select value=\"{{ lead.residency }}\" sc-camel-on-change=\"{{ setResidency }}\" style=\"width:100%;padding:12px 10px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:13px;font-family:'Geist',sans-serif;\">\n                <option value=\"\">Residency<\u002Foption>\n                <option value=\"national\">UAE National<\u002Foption>\n                <option value=\"resident\">UAE Resident<\u002Foption>\n                <option value=\"expat\">Non-Resident / Expat<\u002Foption>\n              <\u002Fsc-raw-select>\n              <sc-raw-select value=\"{{ lead.employment }}\" sc-camel-on-change=\"{{ setEmployment }}\" style=\"width:100%;padding:12px 10px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:13px;font-family:'Geist',sans-serif;\">\n                <option value=\"\">Employment<\u002Foption>\n                <option value=\"salaried\">Salaried<\u002Foption>\n                <option value=\"self-employed\">Self-Employed<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <input type=\"text\" placeholder=\"Mortgage amount (AED)\" value=\"{{ lead.mortgageAmount }}\" sc-camel-on-change=\"{{ setMortgageAmount }}\" style=\"width:100%;padding:12px 14px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:14px;font-family:'Geist',sans-serif;\">\n            <button sc-camel-on-click=\"{{ submitLead }}\" style=\"width:100%;padding:14px;border-radius:6px;background:#111111;color:#ffffff;font-size:14.5px;font-weight:600;border:none;cursor:pointer;margin-top:2px;\">Submit Form<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:10px clamp(20px,4vw,64px) 20px;max-width:780px;display:flex;flex-direction:column;gap:50px;\">\n    <div style=\"border-top:1px solid #ececec;padding-top:30px;\">\n      <h2 style=\"font-size:22px;font-weight:600;margin:0 0 14px;color:#111111;\">Signs it might be worth exploring<\u002Fh2>\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;\">\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;\"><span>✓<\u002Fspan>Your current rate is noticeably above what new customers are being offered<\u002Fli>\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;\"><span>✓<\u002Fspan>Your fixed-rate period is ending and reverting to a higher variable rate<\u002Fli>\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;\"><span>✓<\u002Fspan>Your financial position has improved enough to qualify for materially better terms<\u002Fli>\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;\"><span>✓<\u002Fspan>You want to switch between conventional and Islamic finance<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #ececec;padding-top:30px;\">\n      <h2 style=\"font-size:22px;font-weight:600;margin:0 0 14px;color:#111111;\">Weighing the maths<\u002Fh2>\n      <p style=\"font-size:15px;color:#5f6368;line-height:1.75;margin:0;\">Most UAE banks charge an early settlement fee of up to 1% of the outstanding balance, or a set minimum, whichever is lower. Compare the total interest saved over your remaining term against this one-off cost using our refinance calculator before committing.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#f7f7f7;border:1px solid #e3e3e3;border-radius:10px;padding:26px 28px;\">\n      <div style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;color:#5f6368;text-transform:uppercase;margin-bottom:14px;\">Key takeaways<\u002Fdiv>\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;\">\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;line-height:1.6;\"><span>✓<\u002Fspan>A meaningful rate gap or an ending fixed period are the two most common triggers to remortgage.<\u002Fli>\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;line-height:1.6;\"><span>✓<\u002Fspan>Always net the early settlement fee against your projected savings before switching.<\u002Fli>\n        <li style=\"font-size:14px;color:#28303b;display:flex;gap:8px;line-height:1.6;\"><span>✓<\u002Fspan>Remortgaging can also be used to switch between conventional and Islamic finance.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #ececec;padding-top:30px;\">\n      <h2 style=\"font-size:22px;font-weight:600;margin:0 0 14px;color:#111111;\">Working through a real example<\u002Fh2>\n      <p style=\"font-size:15px;color:#5f6368;line-height:1.75;margin:0 0 14px;\">Say your outstanding balance is AED 1,200,000 at 4.5%, and a new bank offers 3.5% for the remaining 15 years. The rate difference alone could save you a meaningful amount in monthly interest, potentially thousands of dirhams a year, depending on your exact balance and term. Against that, a 1% early settlement fee on the current balance would cost roughly AED 12,000 as a one-off charge. If the interest savings over even a year or two clearly outweigh that fee, and you plan to stay in the property for several more years, the case for remortgaging is usually strong.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #ececec;padding-top:30px;\">\n      <h2 style=\"font-size:22px;font-weight:600;margin:0 0 14px;color:#111111;\">Timing your application well<\u002Fh2>\n      <p style=\"font-size:15px;color:#5f6368;line-height:1.75;margin:0;\">If you're on a fixed rate, start comparing offers two to three months before it expires, since a new mortgage application takes time to process and you want the new rate in place before reverting to a higher variable rate. Applying too early, before you have a firm end date for your current fixed period, can also work against you if rates move in the meantime.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #ececec;padding-top:30px;\">\n      <h2 style=\"font-size:22px;font-weight:600;margin:0 0 14px;color:#111111;\">Related reading<\u002Fh2>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n        <a href=\"Refinance Calculator.dc.html\" style=\"padding:10px 18px;border:1px solid #e3e3e3;border-radius:999px;font-size:13px;color:#28303b;text-decoration:none;\">Refinance Calculator<\u002Fa>\n        <a href=\"Understanding Early Settlement Fees.dc.html\" style=\"padding:10px 18px;border:1px solid #e3e3e3;border-radius:999px;font-size:13px;color:#28303b;text-decoration:none;\">Early Settlement Fees<\u002Fa>\n        <a href=\"Remortgage.dc.html\" style=\"padding:10px 18px;border:1px solid #e3e3e3;border-radius:999px;font-size:13px;color:#28303b;text-decoration:none;\">Remortgage Solutions<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"padding:60px clamp(20px,4vw,64px);background:#f7f7f7;\">\n    <div style=\"max-width:780px;margin:0 auto;\">\n      <h2 style=\"font-size:24px;font-weight:600;margin:0 0 28px;color:#111111;\">Frequently Asked Questions<\u002Fh2>\n      <sc-for list=\"{{ faqItems }}\" as=\"item\" hint-placeholder-count=\"3\">\n        <div style=\"border-bottom:1px solid #e3e3e3;\">\n          <button sc-camel-on-click=\"{{ item.toggle }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;background:none;border:none;cursor:pointer;text-align:left;\">\n            <span style=\"font-size:15px;font-weight:600;color:#111111;\">{{ item.q }}<\u002Fspan>\n            <span style=\"font-size:20px;color:#111111;flex-shrink:0;\">{{ item.symbol }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:14px;color:#5f6368;line-height:1.7;margin:0 0 20px;\">{{ item.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:60px clamp(20px,4vw,64px);background:#f7f7f7;\">\n    <div style=\"max-width:600px;margin:0 auto;text-align:center;\">\n      <h2 style=\"font-size:clamp(24px,3vw,30px);font-weight:600;margin:0 0 14px;color:#111111;\">Ready to see your own numbers?<\u002Fh2>\n      <p style=\"font-size:14.5px;color:#5f6368;line-height:1.6;margin:0 0 24px;\">Two-minute check, no obligation.<\u002Fp>\n      <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap;\">\n        <a href=\"index.dc.html#eligibility\" style=\"display:inline-flex;align-items:center;padding:14px 28px;border-radius:6px;background:#111111;color:#ffffff;font-size:14.5px;font-weight:600;text-decoration:none;\">Check My Eligibility<\u002Fa>\n        <a href=\"https://wa.me/971589045696\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;padding:14px 26px;border-radius:6px;border:1.5px solid #d5d5 u002Fcircle><circle cx=\"17.2\" cy=\"6.8\" r=\"1\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n          <a href=\"https://facebook.com\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\" style=\"width:32px;height:32px;border-radius:50%;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;color:#c9c9c9;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M15 8h-2a2 2 0 0 0-2 2v10M9 13h5\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n          <a href=\"https://x.com\" target=\"_blank\" rel=\"noopener\" aria-label=\"X\" style=\"width:32px;height:32px;border-radius:50%;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;color:#c9c9c9;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"currentColor\"><path d=\"M18.9 2H22l-7.6 8.7L23 22h-6.6l-5.2-6.8L5.3 22H2.1l8.1-9.3L1.5 2h6.7l4.7 6.2L18.9 2zm-1.2 18h1.8L7.3 3.9H5.4l12.3 16.1z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <a href=\"https://linkedin.com\" target=\"_blank\" rel=\"noopener\" aria-label=\"LinkedIn\" style=\"width:32px;height:32px;border-radius:50%;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;color:#c9c9c9;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"><\u002Frect><path d=\"M7.5 10v7M7.5 7.2v.1M11.5 17v-4a2.2 2.2 0 0 1 4.4 0v4M11.5 17v-7\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1240px;margin:0 auto;padding-top:22px;border-top:1px solid #2a2a2a;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n      <span style=\"font-size:12px;color:#7a7a7a;\">© 2026 Credo Capital. Free to buyers, financing subject to lender criteria and credit approval. Golden Visa eligibility is determined solely by UAE federal authorities. · <a href=\"Terms and Conditions.dc.html\" style=\"color:#7a7a7a;\">Terms &amp; Conditions<\u002Fa> · <a href=\"Privacy Policy.dc.html\" style=\"color:#7a7a7a;\">Privacy Policy<\u002Fa><\u002Fspan>\n      <span style=\"font-size:12px;color:#7a7a7a;\">credocapital.ae<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if value=\"{{ callBackOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;\" sc-camel-on-click=\"{{ closeCallBack }}\">\n      <div style=\"background:#ffffff;border-radius:12px;padding:32px;max-width:400px;width:100%;position:relative;\" sc-camel-on-click=\"{{ stopPropagation }}\">\n        <button sc-camel-on-click=\"{{ closeCallBack }}\" aria-label=\"Close\" style=\"position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;font-size:20px;color:#5f6368;line-height:1;\">×<\u002Fbutton>\n        <sc-if value=\"{{ cbSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:20px 0;\">\n            <div style=\"font-size:28px;margin-bottom:12px;\">✓<\u002Fdiv>\n            <h3 style=\"font-size:17px;font-weight:600;margin:0 0 8px;color:#111111;\">Request received<\u002Fh3>\n            <p style=\"font-size:13.5px;color:#5f6368;line-height:1.6;margin:0;\">A mortgage advisor will call you within one business day.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cbNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:17px;font-weight:600;color:#111111;margin-bottom:4px;\">Get a Call Back<\u002Fdiv>\n          <div style=\"font-size:13px;color:#5f6368;margin-bottom:20px;\">Leave your number, we'll call you shortly.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <input type=\"text\" placeholder=\"Full name\" value=\"{{ cbName }}\" sc-camel-on-change=\"{{ setCbName }}\" style=\"width:100%;padding:12px 14px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:14px;font-family:'Geist',sans-serif;\">\n            <input type=\"text\" placeholder=\"Mobile number\" value=\"{{ cbMobile }}\" sc-camel-on-change=\"{{ setCbMobile }}\" style=\"width:100%;padding:12px 14px;background:#ffffff;border:1px solid #d5d5d5;border-radius:6px;color:#111111;font-size:14px;font-family:'Geist',sans-serif;\">\n            <sc-if value=\"{{ cbError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#b3261e;\">{{ cbError }}<\u002Fdiv><\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ submitCallBack }}\" style=\"width:100%;padding:14px;border-radius:6px;background:#111111;color:#ffffff;font-size:14.5px;font-weight:600;border:none;cursor:pointer;\">Request Call Back<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    navOpen: null, compact: false, mobileMenuOpen: false, callBackOpen: false, cbName: '', cbMobile: '', cbError: '', cbSubmitted: false,\n    openFaq: 0,\n    lead: { name: '', mobile: '', email: '', residency: '', employment: '', mortgageAmount: '' },\n    errors: {},\n    leadSubmitted: false\n  };\n  faqData = [{\"q\":\"Is there a minimum period before I can remortgage?\",\"a\":\"Most banks allow refinancing after an initial lock-in period, commonly 6-12 months, though this varies by lender and product.\"},{\"q\":\"Do early settlement fees apply to Islamic finance too?\",\"a\":\"Yes, Islamic finance structures carry an equivalent early settlement charge, generally in line with the same UAE Central Bank guidance.\"},{\"q\":\"Can I remortgage with a different bank than my current one?\",\"a\":\"Yes, switching to a new lender is one of the most common reasons to remortgage, alongside simply renegotiating with your existing bank.\"}];\n  toggleFaq(i) { this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i })); }\n  setField(key, val) { this.setState(s => ({ lead: { ...s.lead, [key]: val }, errors: { ...s.errors, [key]: undefined } })); }\n  submitLead() {\n    const l = this.state.lead;\n    const errors = {};\n    if (!l.name.trim()) errors.name = 'Please enter your name.';\n    if (!/^[0-9+ ]{7,}$/.test(l.mobile.trim())) errors.mobile = 'Enter a valid mobile number.';\n    if (!/^\\S+@\\S+\\.\\S+$/.test(l.email.trim())) errors.email = 'Enter a valid email.';\n    if (Object.keys(errors).length) { this.setState({ errors }); return; }\n    const body = new URLSearchParams({ 'form-name': 'lead-form', name: l.name, mobile: l.mobile, email: l.email, residency: l.residency, employment: l.employment, mortgageAmount: l.mortgageAmount }).toString();\n    fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body }).catch(() => {});\n    this.setState({ leadSubmitted: true });\n  }\n  openCallBack() { this.setState({ callBackOpen: true, cbSubmitted: false, cbError: '' }); }\n  closeCallBack() { this.setState({ callBackOpen: false }); }\n  stopPropagation(e) { e.stopPropagation(); }\n  submitCallBack() {\n    const name = this.state.cbName.trim();\n    const mobile = this.state.cbMobile.trim();\n    if (!name || !/^[0-9+ ]{7,}$/.test(mobile)) { this.setState({ cbError: 'Please enter your name and a valid mobile number.' }); return; }\n    const body = new URLSearchParams({ 'form-name': 'lead-form', name, mobile }).toString();\n    fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body }).catch(() => {});\n    this.setState({ cbSubmitted: true, cbError: '' });\n  }\n  componentDidMount() {\n    this.__updateCompact = () => this.setState({ compact: window.innerWidth < 880 });\n    this.__updateCompact();\n    window.addEventListener('resize', this.__updateCompact);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.__updateCompact);\n  }\n  renderVals() {\n    return {\n      callBackOpen: this.state.callBackOpen,\n      cbSubmitted: this.state.cbSubmitted,\n      cbNotSubmitted: !this.state.cbSubmitted,\n      cbName: this.state.cbName,\n      cbMobile: this.state.cbMobile,\n      cbError: this.state.cbError,\n      setCbName: e => this.setState({ cbName: e.target.value }),\n      setCbMobile: e => this.setState({ cbMobile: e.target.value }),\n      openCallBack: () => this.openCallBack(),\n      closeCallBack: () => this.closeCallBack(),\n      stopPropagation: e => this.stopPropagation(e),\n      submitCallBack: () => this.submitCallBack(),\n      navGroupStyle: this.state.compact ? (this.state.mobileMenuOpen ? 'display:flex;flex-direction:column;align-items:stretch;gap:6px;position:fixed;top:64px;left:0;right:0;bottom:0;background:#ffffff;padding:20px 24px 32px;z-index:90;overflow-y:auto;' : 'display:none;') : 'display:flex;align-items:center;justify-content:flex-end;gap:28px;flex:1;margin-right:16px;',\n      navInnerStyle: this.state.compact ? (this.state.mobileMenuOpen ? 'display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%;line-height:2.6;' : 'display:none;') : 'display:flex;align-items:center;gap:clamp(14px,2vw,32px);flex-wrap:wrap;',\n      hamburgerStyle: this.state.compact ? 'display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;border:1px solid #d5d5d5;background:#ffffff;cursor:pointer;flex-shrink:0;' : 'display:none;',\n      toggleMobileMenu: () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen })),\n      mortgagesNavOpen: this.state.navOpen === 'mortgages',\n      resourcesNavOpen: this.state.navOpen === 'resources',\n      openMortgagesNav: () => this.setState({ navOpen: 'mortgages' }),\n      openResourcesNav: () => this.setState({ navOpen: 'resources' }),\n      closeNav: () => this.setState({ navOpen: null }),\n      faqItems: this.faqData.map((f, i) => ({\n        q: f.q, a: f.a, open: this.state.openFaq === i,\n        symbol: this.state.openFaq === i ? '–' : '+',\n        toggle: () => this.toggleFaq(i)\n      })),\n      lead: this.state.lead,\n      errors: this.state.errors,\n      leadSubmitted: this.state.leadSubmitted,\n      leadNotSubmitted: !this.state.leadSubmitted,\n      setName: e => this.setField('name', e.target.value),\n      setMobile: e => this.setField('mobile', e.target.value),\n      setEmail: e => this.setField('email', e.target.value),\n      setResidency: e => this.setField('residency', e.target.value),\n      setEmployment: e => this.setField('employment', e.target.value),\n      setMortgageAmount: e => this.setField('mortgageAmount', e.target.value),\n      submitLead: () => this.submitLead()\n    };\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
